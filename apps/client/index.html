<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14161c" />
    <title>Chess Battler</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <span class="army army-b" id="army-b"></span>
        <span class="tick" id="tick">Такт 0</span>
      </header>
      <div class="stage" id="stage"></div>
      <div class="bar">
        <span class="army army-a" id="army-a"></span>
      </div>
      <footer class="controls">
        <button class="speed" id="speed" type="button" aria-label="Скорость">×1</button>
        <button class="skip" id="skip" type="button" disabled>Пропустить</button>
        <button class="fight" id="fight" type="button">Бой</button>
      </footer>
      <div class="result" id="result" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
